upstream load_balancer {
    least_conn;
    zone api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8080 resolve;
}

server {
    listen 80;

    location / {
        proxy_pass http://load_balancer;
    }

    location = /metrics {
        return 404;
    }
}

server {
    listen 8080;
     
    location /stub_status {
        stub_status;
        access_log off;
    }
}
