global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-prometheus-exporter:9113"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8080
        refresh_interval: 10s
